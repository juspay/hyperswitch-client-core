appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Sheet - backgrounding the app keeps the sheet and typed card details
tags:
  - nightly
  - sheet
---
- runFlow:
    file: ../subflows/open_payment_sheet.yaml
    env:
      SCENARIO: no_three_ds
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 20000
- runFlow: ../subflows/fill_card.yaml
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
# Bring the running app back to the front (no restart).
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
      text: ".*4242.*"
    timeout: 15000
- assertVisible:
    id: ExpiryInputTestId
    text: "04 ?/ ?44"
- runFlow: ../subflows/pay.yaml
- runFlow: ../subflows/expect_payment_succeeded.yaml
- runFlow:
    file: ../subflows/check_backend_payment.yaml
    env:
      EXPECT_STATUS: succeeded
      EXPECT_LAST4: "4242"
