appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Widget - embedded element pays with a new card
tags:
  - smoke
  - pr
  - widget
  - card
  - android-only
---
- runFlow:
    file: ../subflows/open_android_widget.yaml
    env:
      SCENARIO: guest
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 20000
- runFlow:
    file: ../subflows/fill_card.yaml
    env:
      KEYBOARD_DISMISS: widget
- runFlow:
    file: ../subflows/tap_host_button.yaml
    env:
      BUTTON_ID: confirmButton2
- runFlow: ../subflows/expect_payment_succeeded.yaml
- runFlow:
    file: ../subflows/check_backend_payment.yaml
    env:
      EXPECT_STATUS: succeeded
      EXPECT_LAST4: "4242"
