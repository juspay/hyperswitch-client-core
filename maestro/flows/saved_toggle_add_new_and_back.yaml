appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Saved card - switch to a new card and back
tags:
  - pr
  - saved
---
- runFlow:
    file: ../subflows/open_payment_sheet.yaml
    env:
      SCENARIO: saved_card
- extendedWaitUntil:
    visible:
      id: AddNewPaymentMethodTestId
    timeout: 20000
- tapOn:
    id: AddNewPaymentMethodTestId
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 10000
- assertNotVisible: "●●●● 4242"
- runFlow: ../subflows/dismiss_dev_overlays.yaml
- tapOn:
    id: UseSavedPaymentMethodsTestId
- extendedWaitUntil:
    visible: "●●●● 4242"
    timeout: 10000
- assertNotVisible:
    id: CardNumberInputTestId
- assertVisible:
    id: AddNewPaymentMethodTestId
