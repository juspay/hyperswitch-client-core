appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Sheet - Android Back while the payment is processing is ignored
tags:
  - nightly
  - sheet
  - android-only
---
# Back pressed right after Pay must not cancel: the host gets the real result.
- runFlow:
    file: ../subflows/open_payment_sheet.yaml
    env:
      SCENARIO: no_three_ds
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 20000
- runFlow: ../subflows/fill_card.yaml
# Not pay.yaml: its tap waits for the screen to settle, which can take longer than the sandbox needs to
# answer. Back would then land after the sheet closed and close the demo app instead.
- runFlow: ../subflows/dismiss_dev_overlays.yaml
- scrollUntilVisible:
    element:
      id: PayButtonTestId
    direction: DOWN
    timeout: 10000
- takeScreenshot: before-pay
- tapOn:
    id: PayButtonTestId
    waitToSettleTimeoutMs: 500
# Back must land while the payment is processing.
- assertVisible: "Processing.*"
- back
- runFlow: ../subflows/expect_payment_succeeded.yaml
- runFlow:
    file: ../subflows/check_backend_payment.yaml
    env:
      EXPECT_STATUS: succeeded
      EXPECT_LAST4: "4242"
