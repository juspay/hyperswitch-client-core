appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Card - an expiry in the current month is accepted
tags:
  - pr
  - card
  - validation
---
- runFlow:
    file: ../subflows/open_payment_sheet.yaml
    env:
      SCENARIO: no_three_ds
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 20000
# MMYY for today's month, computed when the flow runs.
- runFlow:
    file: ../subflows/fill_card.yaml
    env:
      EXPIRY: "${String(new Date().getMonth() + 1).padStart(2, '0') + String(new Date().getFullYear()).slice(2)}"
- assertVisible:
    id: ExpiryInputTestId
    text: "${String(new Date().getMonth() + 1).padStart(2, '0') + ' / ' + String(new Date().getFullYear()).slice(2)}"
- runFlow: ../subflows/pay.yaml
- runFlow: ../subflows/expect_payment_succeeded.yaml
- runFlow:
    file: ../subflows/check_backend_payment.yaml
    env:
      EXPECT_STATUS: succeeded
