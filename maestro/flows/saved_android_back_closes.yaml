appId: "${maestro.platform == 'ios' ? 'io.hyperswitch' : 'io.hyperswitch.demoapp'}"
name: Saved card - Android Back closes the sheet from the saved list and from add-new
tags:
  - nightly
  - saved
  - android-only
---
# Back does not return from "add new" to the saved list; it closes the sheet.
- runFlow:
    file: ../subflows/open_payment_sheet.yaml
    env:
      SCENARIO: saved_card
- extendedWaitUntil:
    visible:
      id: AddNewPaymentMethodTestId
    timeout: 20000
- back
- runFlow: ../subflows/expect_payment_cancelled.yaml
- runFlow: ../subflows/tap_launch_payment_sheet.yaml
- extendedWaitUntil:
    visible:
      id: AddNewPaymentMethodTestId
    timeout: 60000
- runFlow: ../subflows/dismiss_dev_overlays.yaml
- tapOn:
    id: AddNewPaymentMethodTestId
- extendedWaitUntil:
    visible:
      id: CardNumberInputTestId
    timeout: 20000
- back
- runFlow: ../subflows/expect_payment_cancelled.yaml
