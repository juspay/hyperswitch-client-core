name: Create Draft Release

on:
  # Every merge into main. PRs are squash-merged as a single Conventional Commit
  # (enforced by internal_linter.yml), so the commit type on main is what decides the bump:
  #   feat -> minor | fix, perf, revert -> patch | BREAKING CHANGE -> major
  #   chore, docs, refactor, style, test, ci, build -> no release
  # The rules live in the "release" block of package.json.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      shared_code:
        description: 'Branch name for the shared-code (manual runs only)'
        required: true
        type: string
        default: 'main'
      versioning_type:
        description: 'Versioning Type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - custom
      custom_version:
        description: 'Custom Version (e.g., 1.2.3) - Only used when versioning_type is custom'
        required: false
        type: string
      generate_release_notes:
        description: 'Generate release notes for custom version'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Two merges landing back to back must not race on the bump. Queue them, and never cancel a
# run mid-flight: an interrupted release can leave a tag pushed without its release commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # semantic-release pushes "chore(release): X.Y.Z [skip ci]" back to main, which is itself a
    # push to main. GitHub honours [skip ci] natively; the second clause is a backstop so a
    # change to the commit template can never turn this into a self-triggering loop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(release):'))
    env:
      SENTRY_DSN: ${{ secrets.HYPERSWITCH_SENTRY_DSN }}
      SENTRY_ENV: 'production'
      HYPERSWITCH_PRODUCTION_URL: ${{ secrets.HYPERSWITCH_PRODUCTION_URL }}
      HYPERSWITCH_INTEG_URL: ${{ secrets.HYPERSWITCH_INTEG_URL }}
      HYPERSWITCH_SANDBOX_URL: ${{ secrets.HYPERSWITCH_SANDBOX_URL }}
      HYPERSWITCH_LOGS_PATH: ${{ secrets.HYPERSWITCH_LOGS_PATH }}
      PROD_ASSETS_END_POINT: ${{ secrets.PROD_ASSETS_END_POINT }}
      SANDBOX_ASSETS_END_POINT: ${{ secrets.SANDBOX_ASSETS_END_POINT }}
      INTEG_ASSETS_END_POINT: ${{ secrets.INTEG_ASSETS_END_POINT }}

    steps:
      # Only relevant for manual runs. On a merge the gate is the PR review + branch rules.
      - name: Check Admin Permission
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor
              });

              if (permission.permission !== 'admin') {
                core.setFailed(`User ${actor} does not have admin permission. Only repository admins can run this workflow.`);
              } else {
                console.log(`User ${actor} has admin permission. Proceeding with workflow.`);
              }
            } catch (error) {
              core.setFailed(`Failed to check permissions: ${error.message}`);
            }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On push take the branch tip rather than the triggering SHA. When two merges land
          # close together the queued run must start from an up-to-date main, otherwise
          # semantic-release aborts with "branch is behind" and that merge never gets released.
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTORELEASE_PAT || github.token }}
          # Submodules are only needed by the bundle rebuild, which is manual-run only.
          submodules: ${{ github.event_name == 'workflow_dispatch' && 'recursive' || 'false' }}

      - name: Setup Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install

      - name: Validate Custom Version Input
        if: github.event.inputs.versioning_type == 'custom'
        run: |
          VERSION_INPUT="${{ github.event.inputs.custom_version }}"
          if [ -z "$VERSION_INPUT" ]; then
            echo "Error: Custom version is required when using custom versioning type"
            exit 1
          fi
          # Validate semantic version format (X.Y.Z) with optional pre-release identifiers
          # Supports formats like: 1.2.3, 1.2.3-alpha, 1.2.3-beta.1, 1.2.3-rc.2, etc.
          if ! echo "$VERSION_INPUT" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' > /dev/null; then
            echo "Error: Invalid version format. Please use semantic versioning."
            echo "Valid formats:"
            echo "  - 1.2.3"
            echo "  - 1.2.3-alpha"
            echo "  - 1.2.3-alpha.1"
            echo "  - 1.2.3-beta"
            echo "  - 1.2.3-beta.2"
            echo "  - 1.2.3-rc.1"
            echo "  - 1.2.3-dev.20250119"
            exit 1
          fi

      - name: Capture Initial Version
        run: echo "INITIAL_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      # Bumps package.json + CHANGELOG.md, commits them, and pushes the vX.Y.Z tag.
      # No-ops (leaving the version untouched) when nothing since the last tag warrants a release.
      - name: Run Semantic Release (Auto Versioning)
        if: github.event_name == 'push' || github.event.inputs.versioning_type == 'auto'
        run: npx semantic-release

      - name: Apply Custom Version
        if: github.event.inputs.versioning_type == 'custom'
        run: |
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
          echo "Applying custom version: $CUSTOM_VERSION"

          # Update package.json version
          jq --arg version "$CUSTOM_VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

          # Commit version changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$CUSTOM_VERSION [skip ci]" || echo "No changes to commit"

          # Create and push tag
          git tag "v$CUSTOM_VERSION" -m "Release v$CUSTOM_VERSION"
          git push origin main --follow-tags

      - name: Check if Version Changed
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          if [ "${{ env.INITIAL_VERSION }}" = "$CURRENT_VERSION" ]; then
            echo "RELEASE_PERFORMED=false" >> $GITHUB_ENV
            echo "No new version was released"
          else
            echo "RELEASE_PERFORMED=true" >> $GITHUB_ENV
            echo "New version $CURRENT_VERSION was released"
          fi

      - name: Generate Release Notes
        if: env.RELEASE_PERFORMED == 'true' && github.event.inputs.versioning_type == 'custom' && github.event.inputs.generate_release_notes == 'true'
        id: generate_notes
        run: |
          # Get the latest tag before the current one
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_VERSION="${{ env.VERSION }}"

          echo "## Release Notes for v$CURRENT_VERSION" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### What's Changed" >> release_notes.md
            echo "" >> release_notes.md

            # Generate commit list since last tag
            git log --pretty=format:"- %s (%h)" --no-merges --invert-grep --grep="\[skip ci\]" $PREVIOUS_TAG..HEAD >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md

            # Generate contributor list
            echo "### Contributors" >> release_notes.md
            git log --pretty=format:"- @%an" $PREVIOUS_TAG..HEAD | sort -u >> release_notes.md
            echo "" >> release_notes.md

            # Statistics
            echo "### Statistics" >> release_notes.md
            echo "- Commits: $(git rev-list --count $PREVIOUS_TAG..HEAD)" >> release_notes.md
            echo "- Changed files: $(git diff --name-only $PREVIOUS_TAG..HEAD | wc -l)" >> release_notes.md

            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...v$CURRENT_VERSION" >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          # Save release notes to environment
          {
            echo 'RELEASE_NOTES<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> $GITHUB_ENV

      # Draft, never published: a human reviews the notes and hits Publish.
      - name: Create Draft GitHub Release
        if: env.RELEASE_PERFORMED == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTORELEASE_PAT || github.token }}
        run: |
          TAG="v${{ env.VERSION }}"

          # The tag was pushed by semantic-release (or by the custom step) - make it visible here.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null || true

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi

          ARGS=(--draft --title "Release $TAG")

          case "${{ env.VERSION }}" in
            *-alpha*|*-beta*|*-rc*|*-dev*) ARGS+=(--prerelease) ;;
          esac

          if [ -s release_notes.md ]; then
            ARGS+=(--notes-file release_notes.md)
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.generate_release_notes }}" = "true" ]; then
            # Let GitHub build "What's Changed" from the merged PRs between the two tags.
            ARGS+=(--generate-notes)
          else
            ARGS+=(--notes "Release $TAG")
          fi

          gh release create "$TAG" "${ARGS[@]}"
          echo "Created draft release $TAG"

      # Bundle rebuilds push to juspay/hyperswitch-sdk-ios and hyperswitch-sdk-android (and the
      # Android push chains into publish_android_release.yml). Far too heavy to run per merge,
      # so both steps below stay manual-run only.
      - name: Update Submodules to Latest
        if: env.RELEASE_PERFORMED == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update all submodules to their latest commits on their default branches
          git submodule update --init --recursive
          SHARED_CODE_BRANCH="${{ github.event.inputs.shared_code || 'main' }}"
          cd shared-code
          git checkout $SHARED_CODE_BRANCH
          cd ..
      - name: Build and Update Bundles
        if: env.RELEASE_PERFORMED == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          # Build bundles in parallel
          yarn re:build

          # Update Android bundle only
          cd android
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          yarn bundle:android
          git add ./app/src/main/assets/hyperswitch.bundle

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${{ env.VERSION }} Android Bundle update [skip ci]"
            git push origin main
          fi
          cd ..

          # Update iOS bundle only
          cd ios
          git checkout main
          git pull origin main
          yarn bundle:ios
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ./hyperswitchSDK/Core/Resources/hyperswitch.bundle

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${{ env.VERSION }} iOS Bundle update [skip ci]"
            git push origin main
          fi

      # always(), but only once the version check has actually run - otherwise an earlier
      # failure would render a misleading "no bump" summary.
      - name: Summarise Outcome
        if: always() && env.RELEASE_PERFORMED != ''
        run: |
          if [ "${{ env.RELEASE_PERFORMED }}" = "true" ]; then
            {
              echo "### 🏷️ Released \`v${{ env.VERSION }}\`"
              echo ""
              echo "| | |"
              echo "| --- | --- |"
              echo "| Previous | \`${{ env.INITIAL_VERSION }}\` |"
              echo "| New | \`${{ env.VERSION }}\` |"
              echo "| Triggered by | \`${{ github.event_name }}\` |"
              echo ""
              echo "The draft release for this tag is under the **Releases** tab — review it and hit Publish."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ⏭️ No version bump"
              echo ""
              echo "Version stays at \`${{ env.VERSION }}\`: nothing since the last tag warrants a release."
              echo ""
              echo "\`feat\` → minor · \`fix\`/\`perf\`/\`revert\` → patch · \`BREAKING CHANGE\` → major."
              echo "\`chore\`, \`docs\`, \`refactor\`, \`style\`, \`test\`, \`ci\`, \`build\` do not bump the version."
            } >> $GITHUB_STEP_SUMMARY
          fi
