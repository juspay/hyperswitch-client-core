name: E2E / Android (Maestro)

# Maestro end-to-end flows (maestro/) on the Android demo app, against the Hyperswitch sandbox through
# maestro/server/e2e-server.js. Pull requests run the flows tagged `smoke`; a manual run runs every flow.
#
# Secrets: each value is given only to the step that needs it, never to the whole job, so dependency
# install scripts and the build never see them. No step prints a secret. The only upload is screenshots
# and step lists of every flow (evidence); device and Maestro logs stay on the runner (they can carry keys).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-android:
    # Pull requests from forks get no repository secrets, so the flows could not reach the sandbox.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A pull request (smoke flows) takes about 26 minutes; a manual run of every flow about 55.
    timeout-minutes: 90
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # Maestro's version check and crash reports go to api.copilot.mobile.dev with this install's id, and no
      # setting turns them off (not even MAESTRO_DISABLE_UPDATE_CHECK). A closed local port keeps them on the
      # runner; `maestro test` does not use this API.
      MAESTRO_API_URL: http://127.0.0.1:9
      MAESTRO_TAG_ARGS: ${{ github.event_name == 'pull_request' && '--include-tags smoke' || '' }}
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Shared Code Repo
        uses: actions/checkout@v4
        with:
          repository: juspay/hyperswitch-sdk-utils
          ref: main
          path: shared-code

      - name: Checkout Android Repo
        uses: actions/checkout@v4
        with:
          repository: juspay/hyperswitch-sdk-android
          ref: main
          path: android

      # An exact version, so a newer Node only arrives through a reviewed change. With `22`, every run would take
      # the newest 22.x (the runner's tool cache is removed above).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          cache: gradle
          distribution: temurin
          java-version: 17

      - name: Compile ReScript
        run: npm run re:build

      # The app runs this branch's JS without Metro. A debug build that cannot reach Metro loads the bundles
      # packed in android/app/src/main/assets, which come from the android repo and can be older than this
      # branch, so they are rebuilt here. Bundling only reads these URLs (no keys); Sentry stays off because
      # SENTRY_DSN is not set.
      - name: Bundle the JS into the demo app
        env:
          HYPERSWITCH_SANDBOX_URL: ${{ secrets.HYPERSWITCH_SANDBOX_URL }}
          SANDBOX_ASSETS_END_POINT: ${{ secrets.SANDBOX_ASSETS_END_POINT }}
        run: |
          npm run bundle:android
          npm run bundle:android:pmm
          npm run bundle:android:payment-methods

      - name: Build demo app
        run: cd android && ./gradlew :demo-app:assembleDebug

      # Before the e2e server starts, so nothing downloaded here runs while the keys are loaded. The release zip is
      # checked against its SHA-256 before it is unpacked. To upgrade, change both values: the hash is in the
      # release's checksums_sha256.txt.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.10.0
          MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.maestro"
          rm -rf "$HOME/.maestro/bin" "$HOME/.maestro/lib"
          mv "$RUNNER_TEMP/maestro/bin" "$RUNNER_TEMP/maestro/lib" "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start the e2e server
        env:
          HYPERSWITCH_SANDBOX_URL: ${{ secrets.HYPERSWITCH_SANDBOX_URL }}
          HYPERSWITCH_PUBLISHABLE_KEY: ${{ secrets.HYPERSWITCH_PUBLISHABLE_KEY }}
          HYPERSWITCH_SECRET_KEY: ${{ secrets.HYPERSWITCH_SECRET_KEY }}
          PROFILE_ID: ${{ secrets.PROFILE_ID }}
        run: |
          nohup node maestro/server/e2e-server.js > e2e-server.log 2>&1 &
          for i in $(seq 1 15); do curl -sf -o /dev/null http://localhost:5252/health && break || sleep 2; done
          curl -sf -o /dev/null http://localhost:5252/scenarios

      # The emulator action is pinned to the commit of its v2.38.0 release: it runs while the e2e server holds the
      # keys, and a tag can be moved to other code.
      - name: Maestro test
        id: maestro
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: medium_phone
          script: |
            maestro/scripts/prepare-android-device.sh emulator-5554 android/demo-app/build/outputs/apk/debug/demo-app-debug.apk
            maestro -p android test maestro/ $MAESTRO_TAG_ARGS --format junit --output maestro-reports/report.xml --test-output-dir maestro-reports/output

      # Labels the failure screenshots with the failing step and reason (ci-report.js skips the label without it).
      - name: Install ImageMagick
        if: always() && (steps.maestro.outcome == 'failure' || steps.maestro.outcome == 'cancelled')
        run: command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null)

      # Results table on the run's Summary page (and in this step's log), failed flows first.
      - name: Test summary
        if: always() && steps.maestro.conclusion != 'skipped'
        run: node maestro/scripts/ci-report.js maestro-reports/report.xml maestro-reports/output maestro-reports/screenshots

      # Evidence for every flow, passed or failed: screenshots, step lists and the sandbox record.
      - name: Upload screenshots
        if: always() && steps.maestro.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: maestro-reports/screenshots/
          retention-days: 90
          if-no-files-found: ignore
